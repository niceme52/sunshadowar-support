<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>太阳测位置 · SunShadowAR</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div class="mark" aria-hidden="true">
        <span class="sun"></span>
        <span class="ring"></span>
      </div>
      <p class="eyebrow">SUNSHADOWAR</p>
      <h1>太阳测位置</h1>
      <p class="lead">在实景画面中寻找太阳的方向。</p>
    </header>

    <section class="grid">
      <article class="card">
        <p class="eyebrow">LIVE CAMERA</p>
        <h2>实景方向参考</h2>
        <p>使用相机、定位和设备运动，在设备条件可靠时显示太阳方向。</p>
      </article>
      <article class="card">
        <p class="eyebrow">ON-DEVICE</p>
        <h2>本地处理</h2>
        <p>无需账户。相机、定位和运动数据不发送到开发者服务器。</p>
      </article>
      <article class="card">
        <p class="eyebrow">SAFETY GATE</p>
        <h2>不可靠时明确降级</h2>
        <p>方向质量不足时隐藏真实太阳标记，避免把不可靠结果伪装成绝对方向。</p>
      </article>
    </section>

    <nav class="links" aria-label="站点链接">
      <a href="privacy.html">隐私政策</a>
      <a href="support.html">技术支持</a>
    </nav>

    <footer>
      <p>结果受设备、磁场、定位和环境条件影响，仅用于方向参考。</p>
      <p>© 2026 Gang Wang</p>
    </footer>
  </main>
</body>
</html>
